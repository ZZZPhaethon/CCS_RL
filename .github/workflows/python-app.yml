name: Repository checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f README_CN.md
          test -f LICENSE
          test -f assets/CCUSRL_overview.png

      - name: Check README links to Chinese version
        run: |
          grep -q "README_CN.md" README.md

      - name: Check README has project title
        run: |
          grep -q "CCS_RLLLM" README.md
